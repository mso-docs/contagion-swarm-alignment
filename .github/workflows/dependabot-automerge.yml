name: Merge reviewed dependency updates
on:
  workflow_run:
    workflows: ['Security, tests and GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  reviewed-action-pins:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge only previously reviewed bot action-pin updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dependabot_automerge.py
