name: Security, tests and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: checks-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Security and reproducibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install pinned security tools and project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.3
          .venv/bin/python -m pip install -r requirements-security.txt -e '.[test]'
      - name: Secret history, candidate files, public-data policy and static checks
        run: .venv/bin/python scripts/check_all.py
      - name: Audit recorded runtime dependency versions
        run: .venv/bin/python -m pip_audit --disable-pip --no-deps -r requirements.lock.txt --cache-dir .cache/pip-audit --progress-spinner off
      - name: Audit installed runtime and security tools
        run: .venv/bin/python -m pip_audit --local --skip-editable --cache-dir .cache/pip-audit --progress-spinner off
      - name: Verify experiment and privacy tests
        run: .venv/bin/python -m pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check dashboard interactions
        run: node tests/dashboard_runtime.js
      - name: Validate and build only allowlisted public assets
        run: .venv/bin/python scripts/build_dashboard.py --out "${{ runner.temp }}/contagion-public"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: ${{ runner.temp }}/contagion-public
  deploy:
    name: Deploy reviewed public snapshot
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
